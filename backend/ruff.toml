line-length = 240
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP"]
ignore = []

[lint.per-file-ignores]
# Exact prompt snapshot strings mirror packaged markdown and cannot be reflowed.
"tests/test_memory_snip.py" = ["E501"]

[lint.isort]
known-first-party = ["deerflow", "app"]

[format]
quote-style = "double"
indent-style = "space"
