[project]
name = "actweave-knowledge"
version = "1.0.0"
description = "ActWeave Knowledge Package — project knowledge bases, ingestion, and retrieval."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "httpx>=0.28.0",
    "minio>=7.2",
    "openpyxl>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.12.5",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actweave_knowledge"]
