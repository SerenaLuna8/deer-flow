[project]
name = "actweave-knowledge"
version = "1.0.0"
description = "ActWeave Knowledge Package — project knowledge bases, ingestion, and retrieval."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "beautifulsoup4==4.14.3",
    "charset-normalizer==3.4.7",
    "ebooklib>=0.18",
    "httpx>=0.28.0",
    "markdown-it-py==4.2.0",
    "minio>=7.2",
    "openpyxl==3.1.5",
    "pandas==3.0.2",
    "pgvector>=0.3",
    "pillow==12.3.0",
    "pydantic>=2.12.5",
    "pypdf>=5.0",
    "pypdfium2==5.7.1",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "tiktoken==0.12.0",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
extraction-local = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
    "unstructured[epub,md,pptx]==0.21.5",
    "python-oxmsg==0.0.2",
    "pypandoc-binary==1.17",
    "python-magic==0.4.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actweave_knowledge"]

[tool.hatch.metadata]
allow-direct-references = true
