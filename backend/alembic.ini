# ActWeave incremental migration chain (U1).
#
# `full_schema.sql` remains the only full-schema source of truth for fresh
# installs; this chain only upgrades existing databases. The equivalence of
# the two paths is enforced by backend/tests/test_schema_migration_parity.py.
#
# No sqlalchemy.url here: migrations/env.py reads DATABASE_URL explicitly
# (same environment discipline as scripts/run_runtime.py, never an implicit
# dotenv load), or an explicit programmatic override from tests.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
