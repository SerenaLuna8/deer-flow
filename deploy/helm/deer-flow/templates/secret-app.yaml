{{- if not .Values.existingAppSecret -}}
{{- $prev := lookup "v1" "Secret" (include "deer-flow.namespace" .) (include "deer-flow.appSecret" .) -}}
{{- $authJwt := "" -}}
{{- $betterAuth := "" -}}
{{- $internalToken := "" -}}
{{- $proxyToken := "" -}}
{{- $provisionerKey := "" -}}
{{- $auditActiveKeyId := "" -}}
{{- $auditKeyring := "" -}}
{{- $credentialActiveKeyId := "" -}}
{{- $credentialKeyring := "" -}}
{{- if $prev -}}
{{- $authJwt = index $prev.data "AUTH_JWT_SECRET" | default "" | b64dec -}}
{{- $betterAuth = index $prev.data "BETTER_AUTH_SECRET" | default "" | b64dec -}}
{{- $internalToken = index $prev.data "DEER_FLOW_INTERNAL_AUTH_TOKEN" | default "" | b64dec -}}
{{- $proxyToken = index $prev.data "DEER_FLOW_PROXY_AUTH_TOKEN" | default "" | b64dec -}}
{{- $provisionerKey = index $prev.data "PROVISIONER_API_KEY" | default "" | b64dec -}}
{{- $auditActiveKeyId = index $prev.data "DEER_FLOW_AUDIT_ACTIVE_KEY_ID" | default "" | b64dec -}}
{{- $auditKeyring = index $prev.data "DEER_FLOW_AUDIT_KEYRING_JSON" | default "" | b64dec -}}
{{- $credentialActiveKeyId = index $prev.data "DEER_FLOW_CREDENTIAL_ACTIVE_KEY_ID" | default "" | b64dec -}}
{{- $credentialKeyring = index $prev.data "DEER_FLOW_CREDENTIAL_KEYRING_JSON" | default "" | b64dec -}}
{{- end -}}
{{- if not $authJwt -}}{{- $authJwt = randAlphaNum 64 -}}{{- end -}}
{{- if not $betterAuth -}}{{- $betterAuth = randAlphaNum 48 | lower -}}{{- end -}}
{{- if not $internalToken -}}{{- $internalToken = randAlphaNum 40 -}}{{- end -}}
{{- if not $proxyToken -}}{{- $proxyToken = randAlphaNum 48 -}}{{- end -}}
{{- if not $provisionerKey -}}{{- $provisionerKey = randAlphaNum 48 -}}{{- end -}}
{{- if not $auditActiveKeyId -}}{{- $auditActiveKeyId = "helm-audit-v1" -}}{{- end -}}
{{- if not $auditKeyring -}}
{{- $auditKey := randAlphaNum 32 | b64enc -}}
{{- $auditKeyring = printf "{\"%s\":\"%s\"}" $auditActiveKeyId $auditKey -}}
{{- end -}}
{{- if not $credentialActiveKeyId -}}{{- $credentialActiveKeyId = "helm-credential-v1" -}}{{- end -}}
{{- if not $credentialKeyring -}}
{{- $credentialKey := randAlphaNum 32 | b64enc -}}
{{- $credentialKeyring = printf "{\"%s\":\"%s\"}" $credentialActiveKeyId $credentialKey -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deer-flow.appSecret" . }}
  namespace: {{ include "deer-flow.namespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_JWT_SECRET: {{ $authJwt | quote }}
  BETTER_AUTH_SECRET: {{ $betterAuth | quote }}
  DEER_FLOW_AUDIT_ACTIVE_KEY_ID: {{ $auditActiveKeyId | quote }}
  DEER_FLOW_AUDIT_KEYRING_JSON: {{ $auditKeyring | quote }}
  DEER_FLOW_CREDENTIAL_ACTIVE_KEY_ID: {{ $credentialActiveKeyId | quote }}
  DEER_FLOW_CREDENTIAL_KEYRING_JSON: {{ $credentialKeyring | quote }}
  DEER_FLOW_INTERNAL_AUTH_TOKEN: {{ $internalToken | quote }}
  DEER_FLOW_PROXY_AUTH_TOKEN: {{ $proxyToken | quote }}
  PROVISIONER_API_KEY: {{ $provisionerKey | quote }}
{{- end -}}
