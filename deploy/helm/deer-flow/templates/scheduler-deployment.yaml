{{- if .Values.scheduler.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deer-flow.fullname" . }}-scheduler
  namespace: {{ include "deer-flow.namespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  # AutomationSchedulerOwnership is process-lifetime and exclusive.
  replicas: 1
  selector:
    matchLabels:
      {{- include "deer-flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "deer-flow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
      annotations:
        checksum/config: {{ include "deer-flow.configChecksum" . }}
    spec:
      {{- include "deer-flow.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.scheduler.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: {{ include "deer-flow.gatewayImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          workingDir: /app
          command: ["sh", "-c"]
          args:
            - cd backend && exec env PYTHONPATH=. uv run --no-sync python -m app.scheduler.app
          env:
            - name: CI
              value: "true"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: UV_CACHE_DIR
              value: /tmp
            - name: DEER_FLOW_PROJECT_ROOT
              value: /app
            - name: DEER_FLOW_CONFIG_PATH
              value: /app/backend/config.yaml
            {{- include "deer-flow.backendSecretEnv" . | nindent 12 }}
            {{- include "deer-flow.backendDatabaseEnv" . | nindent 12 }}
            - name: NO_PROXY
              value: localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner
            - name: no_proxy
              value: localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner
          startupProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 20
            periodSeconds: 20
          {{- with .Values.scheduler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/backend/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "deer-flow.fullname" . }}-config
{{- end -}}
