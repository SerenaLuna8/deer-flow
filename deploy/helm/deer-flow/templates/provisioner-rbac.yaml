{{- if .Values.provisioner.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "deer-flow.fullname" . }}-provisioner
  namespace: {{ include "deer-flow.namespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
---
# Namespaced permissions: manage sandbox Pods + Services in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "deer-flow.fullname" . }}-provisioner
  namespace: {{ include "deer-flow.namespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
rules:
  # docker/provisioner/app.py reads, creates and deletes dynamically named
  # sandbox Pods and Services; the list endpoint also lists labeled Services.
  # watch, pod logs, exec, update and patch are intentionally absent.
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "deer-flow.fullname" . }}-provisioner
  namespace: {{ include "deer-flow.namespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "deer-flow.fullname" . }}-provisioner
    namespace: {{ include "deer-flow.namespace" . }}
roleRef:
  kind: Role
  name: {{ include "deer-flow.fullname" . }}-provisioner
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-scoped: read/create Namespaces so the provisioner can ensure the
# sandbox namespace exists (mirrors docker/provisioner/README.md:202-206).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "deer-flow.fullname" . }}-provisioner-ns
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "deer-flow.fullname" . }}-provisioner-ns
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "deer-flow.fullname" . }}-provisioner
    namespace: {{ include "deer-flow.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "deer-flow.fullname" . }}-provisioner-ns
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
