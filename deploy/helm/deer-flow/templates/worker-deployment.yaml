apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deer-flow.fullname" . }}-worker
  namespace: {{ include "deer-flow.namespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "deer-flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "deer-flow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        # Every startup-only AppConfig change must roll the execution fleet.
        checksum/config: {{ include "deer-flow.configChecksum" . }}
    spec:
      {{- include "deer-flow.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.persistence.home.enabled }}
      # Worker can start before Gateway, so it must create its own subPath.
      initContainers:
        - name: init-home
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /home-pvc/deer-flow/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home-pvc
      {{- end }}
      containers:
        - name: worker
          image: {{ include "deer-flow.gatewayImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          workingDir: /app
          command: ["sh", "-c"]
          args:
            - cd backend && exec env PYTHONPATH=. uv run --no-sync python -m app.worker.app
          env:
            - name: CI
              value: "true"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: UV_CACHE_DIR
              value: /tmp
            - name: DEER_FLOW_PROJECT_ROOT
              value: /app
            - name: DEER_FLOW_HOME
              value: /app/backend/.deer-flow
            - name: DEER_FLOW_CONFIG_PATH
              value: /app/backend/config.yaml
            - name: DEER_FLOW_HOST_BASE_DIR
              value: /app/backend/.deer-flow
            - name: DEER_FLOW_HOST_SKILLS_PATH
              value: /app/skills
            {{- include "deer-flow.backendSecretEnv" . | nindent 12 }}
            {{- include "deer-flow.backendDatabaseEnv" . | nindent 12 }}
            - name: NO_PROXY
              value: localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner
            - name: no_proxy
              value: localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner
          startupProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 20
            periodSeconds: 20
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/backend/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: skills
              mountPath: /app/skills
              readOnly: true
            {{- if .Values.persistence.home.enabled }}
            - name: home
              mountPath: /app/backend/.deer-flow
              subPath: deer-flow
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "deer-flow.fullname" . }}-config
        - name: skills
          {{- if .Values.skills.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.skills.existingClaim }}
          {{- else if .Values.skills.configMap }}
          configMap:
            name: {{ .Values.skills.configMap }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.persistence.home.enabled }}
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "deer-flow.homePVC" . }}
        {{- end }}
