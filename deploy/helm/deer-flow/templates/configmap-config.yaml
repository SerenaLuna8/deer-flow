{{- if .Values.postgresql.enabled -}}
{{- if or .Values.postgresql.external.databaseUrl .Values.postgresql.external.existingSecret -}}
{{- fail "postgresql.enabled=true cannot be combined with postgresql.external settings" -}}
{{- end -}}
{{- else -}}
{{- if .Values.postgresql.existingSecret -}}
{{- fail "external PostgreSQL must use postgresql.external.existingSecret, not postgresql.existingSecret" -}}
{{- end -}}
{{- if and .Values.postgresql.external.databaseUrl .Values.postgresql.external.existingSecret -}}
{{- fail "set only one of postgresql.external.databaseUrl or postgresql.external.existingSecret" -}}
{{- end -}}
{{- if not (or .Values.postgresql.external.databaseUrl .Values.postgresql.external.existingSecret) -}}
{{- fail "PostgreSQL is required: configure a pre-initialized postgresql.external database or explicitly enable the bundled empty instance" -}}
{{- end -}}
{{- end -}}
{{- $appConfig := fromYaml (.Values.config | default "") -}}
{{- if not (kindIs "map" $appConfig) -}}
{{- fail "config must be a YAML mapping" -}}
{{- end -}}
{{- if hasKey $appConfig "Error" -}}
{{- fail "config must contain valid YAML" -}}
{{- end -}}
{{- if hasKey $appConfig "models" -}}
{{- fail "config.models is retired; models are stored in PostgreSQL and configured at /admin/settings/models" -}}
{{- end -}}
{{- $workerConfig := (get $appConfig "worker") | default (dict) -}}
{{- if not (kindIs "map" $workerConfig) -}}
{{- fail "config.worker must be a YAML mapping" -}}
{{- end -}}
{{- $_ := set $workerConfig "enabled" true -}}
{{- $_ = set $appConfig "worker" $workerConfig -}}
{{- $schedulerConfig := (get $appConfig "scheduler") | default (dict) -}}
{{- if not (kindIs "map" $schedulerConfig) -}}
{{- fail "config.scheduler must be a YAML mapping" -}}
{{- end -}}
{{- $_ = set $schedulerConfig "enabled" .Values.scheduler.enabled -}}
{{- $_ = set $appConfig "scheduler" $schedulerConfig -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deer-flow.fullname" . }}-config
  namespace: {{ include "deer-flow.namespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ toYaml $appConfig | indent 4 }}
