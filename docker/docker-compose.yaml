# ActWeave Production Environment
# Usage: make up
#
# Services:
#   - nginx:       Reverse proxy (port 2026, configurable via PORT env var)
#   - frontend:    Next.js production server
#   - gateway:     FastAPI admission/query/SSE API
#   - worker:      Required durable Agent-graph executor
#   - scheduler:   Optional Automation admission process
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Key environment variables (set via environment/.env or scripts/deploy.sh):
#   ACT_WEAVE_PROJECT_ROOT           — project root for relative runtime paths
#   ACT_WEAVE_HOME                   — runtime data dir, default .deer-flow under $ACT_WEAVE_PROJECT_ROOT (or cwd)
#   ACT_WEAVE_CONFIG_PATH            — path to config.yaml
#   ACT_WEAVE_SKILLS_PATH            — skills dir, default $ACT_WEAVE_PROJECT_ROOT/skills
#   ACT_WEAVE_DOCKER_SOCKET          — Docker socket path for aio/DooD mode, default /var/run/docker.sock (used only by the opt-in docker-compose.dood.yaml overlay)
#   ACT_WEAVE_REPO_ROOT              — repo root (used for skills host path in DooD)
#   BETTER_AUTH_SECRET               — required for frontend auth/session security
#   ACT_WEAVE_INTERNAL_AUTH_TOKEN    — shared internal Gateway auth token for multi-worker IM channels
#   ACT_WEAVE_PROXY_AUTH_TOKEN       — nginx-to-Gateway client-IP attestation token
#   PROVISIONER_API_KEY              — shared config value; Worker authenticates to Provisioner with it
#
# LangSmith tracing is disabled by default (LANGSMITH_TRACING=false).
# Set LANGSMITH_TRACING=true and LANGSMITH_API_KEY in .env to enable it.
#
# Access: http://localhost:${PORT:-2026}

services:
  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: deer-flow-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    environment:
      - ACT_WEAVE_PROXY_AUTH_TOKEN=${ACT_WEAVE_PROXY_AUTH_TOKEN}
    command: >
      sh -c "envsubst '$$ACT_WEAVE_PROXY_AUTH_TOKEN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    networks:
      - deer-flow
    restart: unless-stopped

  # ── Frontend: Next.js Production ───────────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: deer-flow-frontend
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - ACT_WEAVE_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - deer-flow
    restart: unless-stopped

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway: &backend-service
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
    container_name: deer-flow-gateway
    # Gateway admits project Runs; the independent Worker executes durable jobs.
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${GATEWAY_WORKERS:-1}"
    volumes:
      - ${ACT_WEAVE_CONFIG_PATH}:/app/backend/config.yaml:ro
      - ../skills:/app/skills:ro
      - ${ACT_WEAVE_HOME}:/app/backend/.deer-flow
      # DooD: the host Docker socket is never mounted into Gateway. The opt-in
      # docker-compose.dood.yaml overlay adds it only to Worker for aio mode.
      # See the repository README.md security boundary for details.

      # CLI auth dirs are never mounted into Gateway. The opt-in
      # docker-compose.cli-auth.yaml overlay adds them read-only only to Worker.
    working_dir: /app
    environment:
      - CI=true
      - GATEWAY_WORKERS=${GATEWAY_WORKERS:-1}
      - ACT_WEAVE_PROJECT_ROOT=/app
      - ACT_WEAVE_HOME=/app/backend/.deer-flow
      - ACT_WEAVE_CONFIG_PATH=/app/backend/config.yaml
      - ACT_WEAVE_CHANNELS_LANGGRAPH_URL=${ACT_WEAVE_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - ACT_WEAVE_CHANNELS_GATEWAY_URL=${ACT_WEAVE_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - ACT_WEAVE_AUDIT_ACTIVE_KEY_ID=${ACT_WEAVE_AUDIT_ACTIVE_KEY_ID:-}
      - ACT_WEAVE_AUDIT_KEYRING_JSON=${ACT_WEAVE_AUDIT_KEYRING_JSON:-}
      - ACT_WEAVE_SECRET_KEY=${ACT_WEAVE_SECRET_KEY:-}
      - ACT_WEAVE_INTERNAL_AUTH_TOKEN=${ACT_WEAVE_INTERNAL_AUTH_TOKEN}
      - ACT_WEAVE_PROXY_AUTH_TOKEN=${ACT_WEAVE_PROXY_AUTH_TOKEN}
      - PROVISIONER_API_KEY=${PROVISIONER_API_KEY:-}
      # DooD path/network translation
      - ACT_WEAVE_HOST_BASE_DIR=${ACT_WEAVE_HOME}
      - ACT_WEAVE_HOST_SKILLS_PATH=${ACT_WEAVE_REPO_ROOT}/skills
      - ACT_WEAVE_SANDBOX_HOST=host.docker.internal
      # Forward only the explicit runtime proxy contract. The root .env is not
      # mounted wholesale because model provider secrets live in PostgreSQL.
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - all_proxy=${all_proxy:-}
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow
    restart: unless-stopped

  # ── Durable Job Worker ────────────────────────────────────────────────────
  worker:
    <<: *backend-service
    container_name: deer-flow-worker
    ports: []
    command: sh -c "cd backend && PYTHONPATH=. uv run python -m app.worker.app"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  # ── Automation Scheduler (opt-in profile; polling is platform-settings owned) ───
  scheduler:
    <<: *backend-service
    container_name: deer-flow-scheduler
    ports: []
    command: sh -c "cd backend && PYTHONPATH=. uv run python -m app.scheduler.app"
    profiles: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: deer-flow-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=deer-flow
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SKILLS_HOST_PATH=${ACT_WEAVE_REPO_ROOT}/skills
      - THREADS_HOST_PATH=${ACT_WEAVE_HOME}/threads
      - ACT_WEAVE_HOST_BASE_DIR=${ACT_WEAVE_HOME}
      - KUBECONFIG_PATH=/root/.kube/config
      - SANDBOX_SERVICE_TYPE=NodePort
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
      - PROVISIONER_API_KEY=${PROVISIONER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  deer-flow:
    driver: bridge
