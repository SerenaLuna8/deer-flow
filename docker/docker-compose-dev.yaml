# ActWeave Development Environment
# Usage: docker-compose -f docker-compose-dev.yaml up --build
#
# Services:
#   - nginx: Reverse proxy (port 2026)
#   - frontend: Frontend Next.js dev server (port 3000)
#   - gateway: Backend admission/query/SSE API (port 8001)
#   - worker: Required durable Agent-graph executor
#   - scheduler: Optional Automation admission process
#   - provisioner (optional): Sandbox provisioner (creates Pods in host Kubernetes)
#
# Prerequisites:
#   - Kubernetes cluster + kubeconfig are only required when using provisioner mode.
#
# Access: http://localhost:2026

services:
  # ── Sandbox Provisioner ────────────────────────────────────────────────
  # Manages per-sandbox Pod + Service lifecycle in the host Kubernetes
  # cluster via the K8s API.
  # Backend accesses sandboxes directly via host.docker.internal:{NodePort}.
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: deer-flow-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=deer-flow
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      # Host paths for K8s HostPath volumes (must be absolute paths accessible by K8s node)
      # On Docker Desktop/OrbStack, use your actual host paths like /Users/username/...
      # Set these in your shell before running docker-compose:
      #   export ACT_WEAVE_ROOT=/absolute/path/to/deer-flow
      - SKILLS_HOST_PATH=${ACT_WEAVE_ROOT}/skills
      - THREADS_HOST_PATH=${ACT_WEAVE_ROOT}/backend/.deer-flow/threads
      # Per-user data base directory for user-scoped skill mounts
      - ACT_WEAVE_HOST_BASE_DIR=${ACT_WEAVE_ROOT}/backend/.deer-flow
      # Production: use PVC instead of hostPath to avoid data loss on node failure.
      # When set, hostPath vars above are ignored for the corresponding volume.
      # USERDATA_PVC_NAME uses subPath (deer-flow/users/{user_id}/threads/{thread_id}/user-data) automatically.
      # - SKILLS_PVC_NAME=deer-flow-skills-pvc
      # - USERDATA_PVC_NAME=deer-flow-userdata-pvc
      - KUBECONFIG_PATH=/root/.kube/config
      - SANDBOX_SERVICE_TYPE=NodePort
      - NODE_HOST=host.docker.internal
      # Override K8S API server URL since kubeconfig uses 127.0.0.1
      # which is unreachable from inside the container
      - K8S_API_SERVER=https://host.docker.internal:26443
      - PROVISIONER_API_KEY=${PROVISIONER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Reverse Proxy ──────────────────────────────────────────────────────
  # Routes API traffic to gateway and (optionally) provisioner.
  nginx:
    image: nginx:alpine
    container_name: deer-flow-nginx
    ports:
      - "2026:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    environment:
      - ACT_WEAVE_PROXY_AUTH_TOKEN=${ACT_WEAVE_PROXY_AUTH_TOKEN}
    command:
      - sh
      - -c
      - |
        set -e
        envsubst '$$ACT_WEAVE_PROXY_AUTH_TOKEN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        test -e /proc/net/if_inet6 || sed -i '/^[[:space:]]*listen[[:space:]]\+\[::\]:2026[[:space:]]/d' /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - gateway
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # Frontend - Next.js Development Server
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: deer-flow-frontend
    command: sh -c "cd frontend && pnpm run dev > /app/logs/frontend.log 2>&1"
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../frontend/public:/app/frontend/public
      - ../frontend/next.config.js:/app/frontend/next.config.js:ro
      - ../logs:/app/logs
      # Mount pnpm store for caching
      - ${PNPM_STORE_PATH:-~/.local/share/pnpm/store}:/root/.local/share/pnpm/store
    working_dir: /app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CI=true
      - ACT_WEAVE_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # Backend - Gateway API
  gateway: &backend-dev-service
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      # cache_from disabled - requires manual setup: mkdir -p /tmp/docker-cache-gateway
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: deer-flow-gateway
    # Startup logic lives in docker/dev-entrypoint.sh — UV_EXTRAS validation,
    # `uv sync --all-packages`, .venv self-heal, and uvicorn handoff. Keeps
    # this file readable and lets the script be linted (shellcheck-clean).
    # See PR #2767 / Issue #2754.
    command: ["sh", "/usr/local/bin/dev-entrypoint.sh"]
    volumes:
      # Mount the dev entrypoint as a read-only file so edits to the script
      # take effect on `make docker-restart` without requiring an image rebuild.
      - ./dev-entrypoint.sh:/usr/local/bin/dev-entrypoint.sh:ro
      - ../backend/:/app/backend/
      # Preserve the .venv built during Docker image build — mounting the full backend/
      # directory above would otherwise shadow it with the (empty) host directory.
      - gateway-venv:/app/backend/.venv
      # Mount the project directory instead of its mutable config files individually.
      # Host editors commonly replace files on save; a directory bind keeps those
      # replacements visible inside Docker Desktop/WSL containers.
      - ../:/app/project
      - ../skills:/app/skills
      - ../logs:/app/logs
      # Use a Docker-managed uv cache volume instead of a host bind mount.
      # On macOS/Docker Desktop, uv may fail to create symlinks inside shared
      # host directories, which causes startup-time `uv sync` to crash.
      - gateway-uv-cache:/root/.cache/uv
      # DooD: the host Docker socket is never mounted into Gateway. The opt-in
      # docker-compose.dood.yaml overlay adds it only to Worker for aio mode.

      # CLI auth dirs are never mounted into Gateway. The opt-in
      # docker-compose.cli-auth.yaml overlay adds them read-only only to Worker.
    working_dir: /app
    environment:
      - CI=true
      # Reload mode is a single uvicorn worker; do not inherit a production override.
      - GATEWAY_WORKERS=1
      - ACT_WEAVE_PROJECT_ROOT=/app
      - ACT_WEAVE_HOME=/app/backend/.deer-flow
      - ACT_WEAVE_CONFIG_PATH=/app/project/config.yaml
      - ACT_WEAVE_CHANNELS_LANGGRAPH_URL=${ACT_WEAVE_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - ACT_WEAVE_CHANNELS_GATEWAY_URL=${ACT_WEAVE_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - ACT_WEAVE_AUDIT_ACTIVE_KEY_ID=${ACT_WEAVE_AUDIT_ACTIVE_KEY_ID:-}
      - ACT_WEAVE_AUDIT_KEYRING_JSON=${ACT_WEAVE_AUDIT_KEYRING_JSON:-}
      - ACT_WEAVE_SECRET_KEY=${ACT_WEAVE_SECRET_KEY:-}
      - ACT_WEAVE_INTERNAL_AUTH_TOKEN=${ACT_WEAVE_INTERNAL_AUTH_TOKEN:-}
      - ACT_WEAVE_PROXY_AUTH_TOKEN=${ACT_WEAVE_PROXY_AUTH_TOKEN:-}
      - PROVISIONER_API_KEY=${PROVISIONER_API_KEY:-}
      # Knowledge MinIO object store (optional feature; Compose creates no MinIO
      # service). Inside Compose the S3 API endpoint must be reachable from both
      # Gateway and Worker, e.g. host.docker.internal:9000 — never the
      # container's own 127.0.0.1. See Install.md.
      - ACT_WEAVE_KNOWLEDGE_MINIO_ENDPOINT=${ACT_WEAVE_KNOWLEDGE_MINIO_ENDPOINT:-}
      - ACT_WEAVE_KNOWLEDGE_MINIO_ACCESS_KEY=${ACT_WEAVE_KNOWLEDGE_MINIO_ACCESS_KEY:-}
      - ACT_WEAVE_KNOWLEDGE_MINIO_SECRET_KEY=${ACT_WEAVE_KNOWLEDGE_MINIO_SECRET_KEY:-}
      - ACT_WEAVE_HOST_BASE_DIR=${ACT_WEAVE_ROOT}/backend/.deer-flow
      - ACT_WEAVE_HOST_SKILLS_PATH=${ACT_WEAVE_ROOT}/skills
      - ACT_WEAVE_SANDBOX_HOST=host.docker.internal
      # Forward only the explicit runtime proxy contract. The root .env is not
      # mounted wholesale because model provider secrets live in PostgreSQL.
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - all_proxy=${all_proxy:-}
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
    extra_hosts:
      # For Linux: map host.docker.internal to host gateway
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # Independent durable execution role.
  worker:
    <<: *backend-dev-service
    container_name: deer-flow-worker
    ports: []
    command: sh -c "cd backend && PYTHONPATH=. uv run python -m app.worker.app"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  # Optional profile; platform automations.enabled controls polling.
  scheduler:
    <<: *backend-dev-service
    container_name: deer-flow-scheduler
    ports: []
    command: sh -c "cd backend && PYTHONPATH=. uv run python -m app.scheduler.app"
    profiles: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

volumes:
  # Persist .venv across container restarts so dependencies installed during
  # image build are not shadowed by the host backend/ directory mount.
  gateway-venv:
  gateway-uv-cache:

networks:
  deer-flow-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
