config_version: 28
log_level: info
logging:
  enhance:
    enabled: false
    format: text
auth:
  # Only these TCP peers may supply X-Real-IP. Loopback covers repository-owned
  # local nginx; container/Helm nginx uses a separate generated proxy token.
  trusted_proxies:
  - 127.0.0.1/32
  - ::1/128
token_usage:
  enabled: true
token_budget:
  enabled: false
  max_tokens: 200000
  max_input_tokens: null
  max_output_tokens: null
  warn_threshold: 0.8
  hard_stop_threshold: 1.0
max_recursion_limit: 1000
models:
- name: deepseek-v4
  display_name: DeepSeek V4 Pro
  use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  model: deepseek-v4-pro
  api_key: $DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  request_timeout: 600.0
  max_retries: 2
  max_tokens: 16384
  temperature: 0.7
  reasoning_effort: high
  supports_thinking: true
  supports_reasoning_effort: true
  supports_vision: false
  when_thinking_enabled:
    extra_body:
      thinking:
        type: enabled
  when_thinking_disabled:
    extra_body:
      thinking:
        type: disabled
tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
tools:
- name: web_search
  group: web
  use: deerflow.community.ddg_search.tools:web_search_tool
  max_results: 5
- name: web_fetch
  group: web
  use: deerflow.community.jina_ai.tools:web_fetch_tool
  timeout: 10
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  group: file:write
  use: deerflow.sandbox.tools:write_file_tool
- name: str_replace
  group: file:write
  use: deerflow.sandbox.tools:str_replace_tool
- name: bash
  group: bash
  use: deerflow.sandbox.tools:bash_tool
tool_search:
  enabled: false
  auto_promote_top_k: 3
mcp_security:
  # Project MCP servers cannot use stdio. Remote project MCP execution is
  # disabled until an operator lists the exact HTTPS endpoint here.
  project_remote_allowed_endpoints: []
  # Keep this enabled in production and route MCP traffic through a proxy that
  # independently blocks loopback, private, link-local, and metadata targets.
  require_egress_proxy: true
  egress_proxy_url: null
  discovery_timeout_seconds: 15
  tool_call_timeout_seconds: 60
tool_output:
  enabled: true
  externalize_min_chars: 12000
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: .tool-results
  exempt_tools:
  - read_file
  - read_file_tool
suggestions:
  enabled: true
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
  tool_freq_overrides:
    web_search:
      warn: 6
      hard_limit: 10
    web_fetch:
      warn: 6
      hard_limit: 10
read_before_write:
  enabled: true
safety_finish_reason:
  enabled: true
uploads:
  pdf_converter: auto
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
  bash_command_timeout: 600
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 32000
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: true
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
  token_counting: tiktoken
  guaranteed_categories:
  - correction
  guaranteed_token_budget: 500
  staleness_review_enabled: true
  staleness_age_days: 90
  staleness_min_candidates: 3
  staleness_max_removals_per_cycle: 10
  staleness_protected_categories:
  - correction
database:
  url: $DATABASE_URL
  pool_size: 5
  max_overflow: 10
  pool_timeout_seconds: 30
  statement_timeout_seconds: 30
scheduler:
  enabled: false
  poll_interval_seconds: 5
  max_concurrent_runs: 3
  min_once_delay_seconds: 60
input_polish:
  enabled: true
  max_chars: 4000
  model_name: null
worker:
  enabled: true
  poll_interval_seconds: 0.5
  lease_seconds: 90
  heartbeat_seconds: 20
  max_concurrent_jobs: 4
  shutdown_grace_seconds: 30
  retry_initial_seconds: 2
  retry_max_seconds: 300
quotas:
  default_member_limit: 20
  default_storage_bytes_limit: 5368709120
  default_concurrent_run_limit: 3
  default_mcp_calls_daily_limit: 10000
  warning_threshold: 0.8
