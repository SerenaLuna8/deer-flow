config_version: 34
log_level: info
logging:
  enhance:
    enabled: false
    format: text
auth:
  # Only these TCP peers may supply X-Real-IP. Loopback covers repository-owned
  # local nginx; container/Helm nginx uses a separate generated proxy token.
  trusted_proxies:
  - 127.0.0.1/32
  - ::1/128
  local:
    # Persistent remember-me cookies require HTTPS, except on localhost.
    # Do not enable this for ordinary public HTTP deployments.
    allow_insecure_persistent_cookie: false
tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
tools:
- name: web_search
  group: web
  use: deerflow.community.ddg_search.tools:web_search_tool
  max_results: 5
- name: web_fetch
  group: web
  use: deerflow.community.jina_ai.tools:web_fetch_tool
  timeout: 10
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  group: file:write
  use: deerflow.sandbox.tools:write_file_tool
- name: str_replace
  group: file:write
  use: deerflow.sandbox.tools:str_replace_tool
- name: bash
  group: bash
  use: deerflow.sandbox.tools:bash_tool
mcp_security:
  # Project MCP servers cannot use stdio. Remote project MCP execution is
  # disabled until an operator lists the exact HTTPS endpoint here.
  project_remote_allowed_endpoints: []
  # Keep this enabled in production and route MCP traffic through a proxy that
  # independently blocks loopback, private, link-local, and metadata targets.
  require_egress_proxy: true
  egress_proxy_url: null
  discovery_timeout_seconds: 15
  tool_call_timeout_seconds: 60
tool_output:
  storage_subdir: .tool-results
uploads:
  pdf_converter: auto
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
  bash_command_timeout: 600
  # Kubernetes Provisioner mode requires both of these settings. The same
  # PROVISIONER_API_KEY must also be present in the Provisioner process.
  # provisioner_url: http://provisioner:8002
  # provisioner_api_key: $PROVISIONER_API_KEY
skills:
  container_path: /mnt/skills
summarization:
  # Deployment-owned prompt text remains in YAML; enablement, thresholds and
  # model selection are managed at /admin/settings/system.
  summary_prompt: null
database:
  url: $DATABASE_URL
  pool_size: 5
  max_overflow: 10
  pool_timeout_seconds: 30
  statement_timeout_seconds: 30
  # Checkpoint representation is a process-wide, restart-required setting.
  # All Gateway and Worker processes must use the same value. "full" keeps
  # compatibility; "delta" stores incremental message writes and materializes
  # them through the scoped checkpoint accessor.
  checkpoint_channel_mode: full
  checkpoint_delta:
    # In delta mode, persist a complete messages seed every N delta writes.
    # This value is also restart-required and must match across all processes.
    snapshot_frequency: 10
scheduler:
  enabled: false
  poll_interval_seconds: 5
  max_concurrent_runs: 3
  min_once_delay_seconds: 60
worker:
  enabled: true
  poll_interval_seconds: 0.5
  lease_seconds: 90
  heartbeat_seconds: 20
  max_concurrent_jobs: 4
  shutdown_grace_seconds: 30
  retry_initial_seconds: 2
  retry_max_seconds: 300
